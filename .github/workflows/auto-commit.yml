name: Auto Commit

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # IST (Indian Standard Time) is UTC + 05:30.
    # To run at 00:00 IST (Midnight IST daily): 18:30 UTC -> '30 18 * * *'
    # To run at 09:00 IST (9:00 AM IST daily): 03:30 UTC -> '30 3 * * *'
    # To run at 21:00 IST (9:00 PM IST daily): 15:30 UTC -> '30 15 * * *'
    - cron: '30 18 * * *' # Runs daily at 00:00 IST (Midnight Indian Time)
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_TIMEZONE: "Asia/Kolkata" # Indian Standard Time (IST)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python activity update script
        run: python updater.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity_log.txt data.json
          git commit -m "chore: automated daily ping [skip ci]" || exit 0
          git push
